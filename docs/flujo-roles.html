<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario mensual por roles · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-paper-2: #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 62ch;
    }

    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1100px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · App de inventario</p>
    <h1>Del catálogo al sello</h1>
    <p class="subtitle">El inventario mensual de una tienda, con los cuatro roles que intervienen y los traspasos entre ellos.</p>

    <div class="scroll">
      <svg viewBox="0 0 1280 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flujo-roles-title flujo-roles-desc">
        <title id="flujo-roles-title">Inventario mensual por roles</title>
        <desc id="flujo-roles-desc">Diagrama de carriles del inventario mensual: el administrador da de alta tienda y usuarios, el coordinador trae el catálogo de Dynamics, arma y reparte las hojas, el contador cuenta a ciegas, el coordinador cierra cada ronda y liquida la planilla, y dos auditores firman y lacran el cierre.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>

        <!-- Divisores de carril -->
        <line x1="40" y1="88"  x2="1240" y2="88"  stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="40" y1="192" x2="1240" y2="192" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="296" x2="1240" y2="296" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="400" x2="1240" y2="400" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="504" x2="1240" y2="504" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

        <!-- Divisor de la columna de roles -->
        <line x1="176" y1="88" x2="176" y2="504" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

        <!-- Etiquetas de carril -->
        <text x="56" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ADMINISTRADOR</text>
        <text x="56" y="248" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">COORDINADOR</text>
        <text x="56" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CONTADOR</text>
        <text x="56" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">AUDITOR ×2</text>

        <!-- ── Conectores (antes que las cajas) ───────────────────────────── -->

        <!-- 1. Alta → Catálogo (traspaso admin → coordinador) -->
        <path d="M 320 140 H 324 q 8 0 8 8 V 236 q 0 8 8 8 H 344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 2. Catálogo → Armar (mismo carril) -->
        <line x1="468" y1="244" x2="492" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 3. Armar → Contar (traspaso coordinador → contador) -->
        <path d="M 616 244 H 620 q 8 0 8 8 V 340 q 0 8 8 8 H 640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 4. Contar → Cerrar ronda (traspaso contador → coordinador) -->
        <path d="M 764 348 H 768 q 8 0 8 -8 V 252 q 0 -8 8 -8 H 788" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 5. Cerrar ronda → Armar (retorno: rondas 2 y 3) -->
        <path d="M 850 268 V 280 q 0 8 -8 8 H 562 q -8 0 -8 -8 V 268" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- 6. Cerrar ronda → Ajustes y liquidación (mismo carril) -->
        <line x1="912" y1="244" x2="936" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 7. Liquidación → firma y lacrado (traspaso crítico) -->
        <path d="M 1060 244 H 1064 q 8 0 8 8 V 444 q 0 8 8 8 H 1084" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- ── Etiquetas de conector (máscara + 8px de aire) ──────────────── -->
        <rect x="252" y="176" width="72" height="12" rx="2" fill="#ffffff"/>
        <text x="288" y="185" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">TIENDA LISTA</text>

        <rect x="548" y="280" width="60" height="12" rx="2" fill="#ffffff"/>
        <text x="578" y="289" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">REPARTO</text>

        <rect x="792" y="284" width="80" height="12" rx="2" fill="#ffffff"/>
        <text x="832" y="293" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">HOJA CERRADA</text>

        <rect x="676" y="268" width="68" height="12" rx="2" fill="#ffffff"/>
        <text x="710" y="277" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">RONDA 2 Y 3</text>

        <rect x="1000" y="334" width="64" height="12" rx="2" fill="#ffffff"/>
        <text x="1032" y="343" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LIQUIDADO</text>

        <!-- ── Pasos ──────────────────────────────────────────────────────── -->

        <!-- Administrador -->
        <rect x="196" y="116" width="124" height="48" rx="6" fill="#ffffff"/>
        <rect x="196" y="116" width="124" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="258" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Alta de tienda</text>
        <text x="258" y="152" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">almacén MD · PIN 6</text>

        <!-- Coordinador -->
        <rect x="344" y="220" width="124" height="48" rx="6" fill="#ffffff"/>
        <rect x="344" y="220" width="124" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="406" y="242" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Traer catálogo</text>
        <text x="406" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">dynamics · con stock</text>

        <rect x="492" y="220" width="124" height="48" rx="6" fill="#ffffff"/>
        <rect x="492" y="220" width="124" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="554" y="242" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Armar y repartir</text>
        <text x="554" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">hojas · por persona</text>

        <rect x="788" y="220" width="124" height="48" rx="6" fill="#ffffff"/>
        <rect x="788" y="220" width="124" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="850" y="242" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cerrar la ronda</text>
        <text x="850" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">solo lo que no cuadró</text>

        <rect x="936" y="220" width="124" height="48" rx="6" fill="#ffffff"/>
        <rect x="936" y="220" width="124" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="998" y="242" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ajustes y planilla</text>
        <text x="998" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">mermas · descuentos</text>

        <!-- Contador -->
        <rect x="640" y="324" width="124" height="48" rx="6" fill="#ffffff"/>
        <rect x="640" y="324" width="124" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
        <text x="702" y="346" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Contar a ciegas</text>
        <text x="702" y="360" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sin ver el stock</text>

        <!-- Auditor · focal -->
        <rect x="1084" y="428" width="124" height="48" rx="6" fill="#ffffff"/>
        <rect x="1084" y="428" width="124" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="1146" y="450" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Firmar y lacrar</text>
        <text x="1146" y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2 firmas · sha-256</text>

        <!-- ── Leyenda ────────────────────────────────────────────────────── -->
        <line x1="40" y1="532" x2="1240" y2="532" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>

        <rect x="40" y="564" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="64" y="573" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Paso del proceso</text>

        <rect x="184" y="564" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
        <text x="208" y="573" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Conteo ciego</text>

        <rect x="320" y="564" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="344" y="573" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Cierre sellado, ya no se corrige</text>

        <line x1="560" y1="570" x2="592" y2="570" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="600" y="573" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Traspaso entre roles</text>

        <line x1="748" y1="570" x2="780" y2="570" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="788" y="573" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Vuelve solo lo que no cuadró</text>
      </svg>
    </div>
  </div>
</body>
</html>
